<!doctype html>
<html lang="en" data-mode="focus">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --focus:#D4382A; --short:#2F7D50; --long:#2E4F87;
  --ink:#fff; --ink-soft:rgba(255,255,255,.78); --line:rgba(255,255,255,.28); --chip:rgba(255,255,255,.14);
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--focus:#B02E1F;--short:#236840;--long:#243F73;color-scheme:dark}
}
:root[data-theme="dark"]{--focus:#B02E1F;--short:#236840;--long:#243F73;color-scheme:dark}
:root[data-mode="focus"]{--accent:var(--focus)}
:root[data-mode="short"]{--accent:var(--short)}
:root[data-mode="long"]{--accent:var(--long)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--accent);transition:background .45s}
body{
  margin:0;height:100%;overflow:auto;background:var(--accent);color:var(--ink);
  font-family:var(--font);transition:background .45s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 16px;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,input,summary{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--chip);max-width:100%}
.tabs button{border:0;background:transparent;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.95rem;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--accent)}

.dial{position:relative;width:min(80vw,320px);aspect-ratio:1}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:10}
.track{stroke:var(--line)}
.bar{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.time{font-size:clamp(3.6rem,19vw,5.6rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.state{font-size:1.05rem;color:var(--ink-soft);font-weight:400}

.controls{display:flex;align-items:center;gap:20px}
.go{border:0;background:var(--ink);color:var(--accent);font-weight:800;font-size:1.25rem;min-width:150px;padding:16px 32px;border-radius:999px;cursor:pointer}
.go:active{transform:scale(.97)}
.ghost{border:0;background:transparent;font-weight:600;padding:10px 6px;cursor:pointer;color:var(--ink-soft)}
.ghost:hover{color:var(--ink)}

.cycle{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:.95rem}
.dots{display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:block}
.dots i.on{background:var(--ink)}

details{width:min(100%,360px);border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:600;color:var(--ink-soft);list-style:none;text-align:center}
summary::-webkit-details-marker{display:none}
.set{display:grid;grid-template-columns:1fr auto;gap:12px 16px;align-items:center;margin-top:16px}
.set input{width:76px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1 class="sr">Pomodoro timer</h1>

<div class="tabs" role="group" aria-label="Timer mode">
  <button data-m="focus" aria-pressed="true">Focus</button>
  <button data-m="short" aria-pressed="false">Short break</button>
  <button data-m="long" aria-pressed="false">Long break</button>
</div>

<div class="dial">
  <svg viewBox="0 0 300 300" aria-hidden="true">
    <circle class="track" cx="150" cy="150" r="140"/>
    <circle class="bar" id="bar" cx="150" cy="150" r="140"/>
  </svg>
  <div class="readout">
    <div class="time" id="time" role="timer" aria-live="off">25:00</div>
    <div class="state" id="state">Ready to focus</div>
  </div>
</div>

<div class="controls">
  <button class="ghost" id="reset">Reset</button>
  <button class="go" id="go">Start</button>
  <button class="ghost" id="skip">Skip</button>
</div>

<div class="cycle">
  <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <span id="cycleText">0 of 4 focus sessions</span>
</div>

<details>
  <summary>Timer lengths</summary>
  <div class="set">
    <label for="n-focus">Focus (minutes)</label><input id="n-focus" type="number" min="1" max="120" inputmode="numeric">
    <label for="n-short">Short break (minutes)</label><input id="n-short" type="number" min="1" max="60" inputmode="numeric">
    <label for="n-long">Long break (minutes)</label><input id="n-long" type="number" min="1" max="90" inputmode="numeric">
  </div>
</details>

<script>
(function(){
  var LABEL={focus:'Focus',short:'Short break',long:'Long break'};
  var READY={focus:'Ready to focus',short:'Time to rest',long:'Take a longer rest'};
  var RUN={focus:'Focus',short:'Resting',long:'Resting'};
  var cfg={focus:25,short:5,long:15};
  try{var s=JSON.parse(localStorage.getItem('pomo-cfg')||'null');if(s){['focus','short','long'].forEach(function(k){var v=+s[k];if(v>=1&&v<=120)cfg[k]=Math.round(v)})}}catch(e){}

  var mode='focus',total=cfg.focus*60,remaining=total,running=false,endAt=0,timer=null,done=0,ctx=null;
  var $=function(id){return document.getElementById(id)};
  var bar=$('bar'),C=2*Math.PI*140;
  bar.style.strokeDasharray=C;

  function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}

  function render(){
    $('time').textContent=fmt(remaining);
    bar.style.strokeDashoffset=C*(1-remaining/total);
    $('go').textContent=running?'Pause':(remaining<total?'Resume':'Start');
    $('state').textContent=running?RUN[mode]:(remaining<total?'Paused':READY[mode]);
    document.title=(running?fmt(remaining)+' · ':'')+LABEL[mode]+' – Pomodoro';
    document.documentElement.setAttribute('data-mode',mode);
    document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===mode)});
    var dots=$('dots').children;
    for(var i=0;i<dots.length;i++)dots[i].className=i<done?'on':'';
    $('cycleText').textContent=done+' of 4 focus sessions';
  }

  function stop(){running=false;clearInterval(timer)}
  function setMode(m){stop();mode=m;total=cfg[m]*60;remaining=total;render()}

  function synth(){
    try{
      if(!ctx)return;
      [0,0.22,0.44].forEach(function(t){
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.type='sine';o.frequency.value=880;o.connect(g);g.connect(ctx.destination);
        var n=ctx.currentTime+t;
        g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(0.3,n+0.02);g.gain.exponentialRampToValueAtTime(0.0001,n+0.18);
        o.start(n);o.stop(n+0.2);
      });
    }catch(e){}
  }

  snd.preload='auto';
  function beep(){
    try{
      snd.currentTime=0;snd.muted=false;
      var p=snd.play();
      if(p&&p.catch)p.catch(synth);
    }catch(e){synth()}
  }
  function unlock(){
    try{
      snd.muted=true;
      var p=snd.play();
      if(p&&p.then)p.then(function(){snd.pause();snd.currentTime=0;snd.muted=false}).catch(function(){snd.muted=false});
    }catch(e){}
  }

  function next(){
    if(mode==='focus'){done=Math.min(done+1,4);return done>=4?'long':'short'}
    if(mode==='long')done=0;
    return 'focus';
  }

  function tick(){
    remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));
    if(remaining===0){beep();setMode(next());return}
    render();
  }

  function start(){
    try{if(!ctx){var A=window.AudioContext||window.webkitAudioContext;if(A)ctx=new A()}if(ctx&&ctx.state==='suspended')ctx.resume()}catch(e){}
    unlock();
    running=true;endAt=Date.now()+remaining*1000;
    clearInterval(timer);timer=setInterval(tick,250);render();
  }

  function toggle(){running?(stop(),render()):start()}

  $('go').addEventListener('click',toggle);
  $('reset').addEventListener('click',function(){setMode(mode)});
  $('skip').addEventListener('click',function(){setMode(next())});
  document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.m)})});
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'&&!/^(INPUT|BUTTON|SUMMARY)$/.test(e.target.tagName)){e.preventDefault();toggle()}
  });
  document.addEventListener('visibilitychange',function(){if(running&&!document.hidden)tick()});

  ['focus','short','long'].forEach(function(k){
    var el=$('n-'+k);el.value=cfg[k];
    el.addEventListener('change',function(){
      var v=Math.round(+el.value);
      if(!(v>=1))v=cfg[k];
      v=Math.min(v,+el.max);el.value=v;cfg[k]=v;
      try{localStorage.setItem('pomo-cfg',JSON.stringify(cfg))}catch(e){}
      if(!running&&mode===k&&remaining===total){total=v*60;remaining=total;render()}
    });
  });

  render();
})();
